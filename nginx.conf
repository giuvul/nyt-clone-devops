# nginx del container front end: serve la single page app e inoltra /api/*
# al servizio "api" di docker compose (stesso schema di Netlify in produzione).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Controllo di salute usato da Docker (HEALTHCHECK) e dal smoke test in CI.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 20s;
    }

    # File con hash nel nome: si possono tenere in cache per sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Ogni altro percorso è una rotta di React Router.
    location / {
        try_files $uri /index.html;
    }
}
